<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: #f5f7ff; background: #0b1020; }
    body::before, body::after { content: ""; position: fixed; width: 38rem; height: 38rem; border-radius: 50%; filter: blur(100px); opacity: .28; pointer-events: none; }
    body::before { background: #684cff; top: -18rem; left: -12rem; }
    body::after { background: #00d4c7; right: -16rem; bottom: -22rem; }
    main { position: relative; width: min(90vw, 760px); padding: clamp(2.5rem, 8vw, 5.5rem); border: 1px solid rgba(255,255,255,.14); border-radius: 28px; background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.035)); box-shadow: 0 30px 100px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.12); backdrop-filter: blur(18px); text-align: center; }
    .spark { display: inline-grid; place-items: center; width: 56px; height: 56px; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,.18); border-radius: 18px; color: #c6bbff; background: rgba(125,99,255,.18); font-size: 1.5rem; box-shadow: 0 0 35px rgba(125,99,255,.22); }
    .eyebrow { margin: 0 0 .9rem; color: #9da8c8; font-size: .75rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 9vw, 6rem); line-height: .98; letter-spacing: -.065em; font-weight: 750; }
    h1 span { color: transparent; background: linear-gradient(100deg, #c9bdff 5%, #8fece3 95%); background-clip: text; -webkit-background-clip: text; }
    p { max-width: 34rem; margin: 1.5rem auto 0; color: #b4bdd5; font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.7; }
    .rule { width: 52px; height: 2px; margin: 2rem auto 0; border-radius: 9px; background: linear-gradient(90deg, #a995ff, #72e8d9); }
    @media (prefers-reduced-motion: no-preference) { main { animation: arrive .8s cubic-bezier(.2,.8,.2,1) both; } @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } } }
  </style>
</head>
<body>
  <main>
    <div class="spark" aria-hidden="true">✦</div>
    <p class="eyebrow">A little something to get started</p>
    <h1>Hello,<br><span>world!</span></h1>
    <p>A fresh page, full of possibility. Thanks for stopping by.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
